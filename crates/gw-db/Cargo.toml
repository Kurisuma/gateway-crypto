[package]
name = "gw-db"
version = "0.1.0"
edition = "2024"
description = "Enterprise SQLite relational ledger & ORM storage engine built with oberer-orm"

[lints.clippy]
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "warn"

[dependencies]
gw-primitives = { workspace = true }
gw-memcache = { path = "../gw-memcache" }
alloy-primitives = { workspace = true }
oberer-orm = { workspace = true }
oberer-orm-derive = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
